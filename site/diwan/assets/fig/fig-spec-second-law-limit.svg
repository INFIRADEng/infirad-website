<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-labelledby="t">
<title id="t">الكفاءة الحرارية: الواقع وحدّ كارنو</title>
<rect width="760" height="446" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">الكفاءة الحرارية: الواقع وحدّ كارنو</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">بين 800 و300 كلفن</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ما فوق 62.5% غير ممكن لأي محرك بين الدرجتين</text>
