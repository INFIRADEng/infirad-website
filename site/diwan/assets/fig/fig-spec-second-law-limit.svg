<rect x="352" y="212" width="130.5" height="118" fill="#a16207" fill-opacity="0.16"/>
<line x1="352" y1="212" x2="352" y2="330" stroke="#a16207" stroke-width="1" stroke-opacity="0.5"/>
<text x="417.3" y="242" font-size="17" font-weight="700" fill="#a16207" text-anchor="middle">بين الواقع والحدّ</text>
<rect x="482.5" y="212" width="217.5" height="118" fill="#9a3412" fill-opacity="0.16"/>
