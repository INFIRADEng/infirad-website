<text x="700" y="360" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">100</text>
<text x="410" y="386" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الكفاءة الحرارية (%)</text>
<line x1="352" y1="210" x2="352" y2="330" stroke="#0a7a4a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="352" y="202" font-size="17" font-weight="700" fill="#0a7a4a" text-anchor="middle">واقعي 40%</text>
<line x1="482.5" y1="210" x2="482.5" y2="330" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="482.5" y="202" font-size="17" font-weight="700" fill="#c2410c" text-anchor="middle">حدّ كارنو 62.5%</text>
<text x="380" y="420" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">المسافة إلى الحدّ إنتروبيا مولّدة لا تُسترد شغلًا</text>
