<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" role="img" aria-labelledby="t">
<title id="t">LMTD: المتوسط الصحيح أقل من الحسابي</title>
<rect width="760" height="336" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">LMTD: المتوسط الصحيح أقل من الحسابي</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ΔT_lm = (ΔT₁ − ΔT₂)/ln(ΔT₁/ΔT₂) — لفّ الفرق الحسابي يبالغ في المساحة</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">طرفا المبادل: 60 كلفن و20 كلفن</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">المتوسط الحسابي</text>
<rect x="270" y="146" width="470" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="260" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨40 K⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">الفرق اللوغاريتمي</text>
<rect x="312.2" y="204" width="427.8" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="302.2" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨36.41 K⁩</text>
<line x1="740" y1="250" x2="270" y2="250" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">20</text>
<text x="270" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">40</text>
<text x="380" y="310" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الفرق 9.9% في ΔT يعني مساحة أكبر بالنسبة نفسها إن استُعمل الحسابي</text>
</g></svg>
