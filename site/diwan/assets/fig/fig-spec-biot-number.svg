<text x="700" y="360" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">0.5</text>
<text x="410" y="386" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">عدد بيوت Bi</text>
<line x1="122.7" y1="210" x2="122.7" y2="330" stroke="#1b2a2f" stroke-width="2" stroke-dasharray="4 3"/>
<text x="122.7" y="202" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">هواء ساكن · 0.0023</text>
<line x1="659.5" y1="210" x2="659.5" y2="330" stroke="#1b2a2f" stroke-width="2" stroke-dasharray="4 3"/>
<text x="659.5" y="202" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">ماء متحرك · 0.47</text>
<text x="380" y="420" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">عند Bi = 0.1 يكون فرق الحرارة بين القلب والسطح 5% من فرق السطح والمائع</text>
