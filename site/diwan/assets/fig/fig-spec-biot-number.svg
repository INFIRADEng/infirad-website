<text x="120" y="360" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">0</text>
<line x1="236" y1="330" x2="236" y2="338" stroke="#1b2a2f" stroke-width="1.5"/>
<text x="236" y="360" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">0.1</text>
<line x1="352" y1="330" x2="352" y2="338" stroke="#1b2a2f" stroke-width="1.5"/>
<text x="352" y="360" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">0.2</text>
<line x1="468" y1="330" x2="468" y2="338" stroke="#1b2a2f" stroke-width="1.5"/>
<text x="468" y="360" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">0.3</text>
<line x1="584" y1="330" x2="584" y2="338" stroke="#1b2a2f" stroke-width="1.5"/>
<text x="584" y="360" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">0.4</text>
