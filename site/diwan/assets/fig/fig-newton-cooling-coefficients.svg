<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t">
<title id="t">معامل الانتقال الحراري h في حالات شائعة</title>
<rect width="760" height="476" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">معامل الانتقال الحراري h في حالات شائعة</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">نفس الفرق الحراري 5 كلفن على السطح</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">h يتغيّر بأربعة أرقام عشرية بين الهواء الساكن والبخار المتكاثف</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">هواء ساكن · حمل طبيعي</text>
<rect x="738" y="146" width="2" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="728" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨10 واط/(م²·كلفن)⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">هواء مروحي · حمل قسري</text>
<rect x="737.1" y="204" width="2.9" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="727.1" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨50 واط/(م²·كلفن)⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ماء مغلي</text>
<rect x="563.8" y="262" width="176.3" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="553.8" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨3000 واط/(م²·كلفن)⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">بخار متكاثف</text>
<rect x="270" y="320" width="470" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="260" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨8000 واط/(م²·كلفن)⁩</text>
<line x1="740" y1="366" x2="270" y2="366" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">4000</text>
<text x="270" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">8000</text>
<text x="505" y="416" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">معامل الانتقال h (واط/(م²·كلفن))</text>
<text x="380" y="450" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">عند h = 10 وفرق 5 كلفن يكون التدفق 50 واط/م²؛ وعند h = 8000 يصبح 40,000 واط/م²</text>
</g></svg>
