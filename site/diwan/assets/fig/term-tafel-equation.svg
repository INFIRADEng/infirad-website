<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">η = b·log₁₀(i/i₀) بـ b = 2.303RT/(αnF) = 118.3 mV/عقد عند α = 0.5 وn = 1</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الزيادة 100 ضعف في التيار = عقدان</text>
