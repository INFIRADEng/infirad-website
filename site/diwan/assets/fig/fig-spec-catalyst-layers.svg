<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-labelledby="t">
<title id="t">طاقة التنشيط على المسارين</title>
<rect width="760" height="434" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">طاقة التنشيط على المسارين</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الفرق 40 كيلوجول/مول يدخل أُسّ أرهينيوس فيسّرع المعدل كثيرًا</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الحفاز لا يستهلك أثناء التفاعل فيبقى فعّالًا بعد انتهائه</text>
<rect x="80" y="140" width="600" height="50" fill="#c2410c" fill-opacity="0.14" stroke="#c2410c" stroke-opacity="0.45"/>
<text x="664" y="169" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">طاقة المسار غير المحفَّز</text>
<text x="96" y="169" font-size="17" font-weight="600" fill="#c2410c" text-anchor="end">⁨100 كيلوجول/مول⁩</text>
<rect x="80" y="196" width="600" height="50" fill="#0e7490" fill-opacity="0.14" stroke="#0e7490" stroke-opacity="0.45"/>
<text x="664" y="225" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">طاقة المسار المحفَّز</text>
<text x="96" y="225" font-size="17" font-weight="600" fill="#0e7490" text-anchor="end">⁨60 كيلوجول/مول⁩</text>
<rect x="80" y="252" width="600" height="50" fill="#1e3a5f" fill-opacity="0.14" stroke="#1e3a5f" stroke-opacity="0.45"/>
<text x="664" y="281" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">الفرق بين المسارين</text>
<text x="96" y="281" font-size="17" font-weight="600" fill="#1e3a5f" text-anchor="end">⁨40 كيلوجول/مول⁩</text>
<rect x="80" y="308" width="600" height="50" fill="#0a7a4a" fill-opacity="0.14" stroke="#0a7a4a" stroke-opacity="0.45"/>
<text x="664" y="337" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">تسريع المعدل عند 500 كلفن</text>
<text x="96" y="337" font-size="17" font-weight="600" fill="#0a7a4a" text-anchor="end">⁨15090 مرة⁩</text>
<text x="380" y="408" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الفرق 40 كيلوجول/مول عند 500 كلفن يعطي تسريعًا 15,090 مرة، ويسقط الفرق حين ينسدّ سطح الحفاز.</text>
