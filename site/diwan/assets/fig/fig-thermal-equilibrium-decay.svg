<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418" role="img" aria-labelledby="t">
<title id="t">اقتراب جسمين من التوازن الحراري</title>
<rect width="760" height="418" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">اقتراب جسمين من التوازن الحراري</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">كوب ماء 0.25 كغ (سطح 0.02 م²) في هواء ساكن UA = 0.2 واط/كلفن</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">فرق الحرارة المبدئي 80 كلفن · ثابت الزمن 5,200 ثانية</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">اللحظة صفر</text>
<rect x="270" y="146" width="470" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="260" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨80 كلفن⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">بعد 87 دقيقة (τ)</text>
<rect x="567.3" y="204" width="172.7" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="557.3" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨29.4 كلفن⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">بعد 4.4 ساعة (3τ)</text>
<rect x="716.5" y="262" width="23.5" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="706.5" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨4 كلفن⁩</text>
<line x1="740" y1="308" x2="270" y2="308" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">40</text>
<text x="270" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">80</text>
<text x="505" y="358" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">فرق الحرارة عن المحيط (كلفن)</text>
<text x="380" y="392" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الاقتراب أُسّي: كل τ يخفض الفرق إلى 37% من قيمته، ولا يبلغ الصفر في زمن منتهٍ</text>
</g></svg>
