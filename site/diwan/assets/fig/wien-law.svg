<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-labelledby="title desc"><title id="title">قانون فين للإزاحة</title><desc id="desc">ثلاث قمم محسوبة على محور لوغاريتمي: ارتفاع الحرارة من 300 إلى 5800 كلفن ينقل قمة الجسم الأسود من 9.66 إلى 0.50 ميكرومتر؛ لا يبين الرسم شدة الإشعاع.</desc><style>text{font-family:Arial,"Noto Sans Arabic",sans-serif}</style><rect width="600" height="840" fill="white"/><text x="565" y="58" font-size="32" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قانون فين للإزاحة</text><line x1="35" y1="86" x2="565" y2="86" stroke="#cbd5e1" stroke-width="2" stroke-dasharray=""/><text x="300" y="142" font-size="25" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">λmax × T = 2897.771955 µm·K</text><text x="565" y="194" font-size="24" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">للجسم الأسود؛ محور الطول الموجي لوغاريتمي</text><line x1="65" y1="365" x2="535" y2="365" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><line x1="65.0" y1="358" x2="65.0" y2="373" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="65.0" y="411" font-size="25" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">0.1</text><line x1="221.66666666666666" y1="358" x2="221.66666666666666" y2="373" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="221.66666666666666" y="411" font-size="25" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">1</text><line x1="378.3333333333333" y1="358" x2="378.3333333333333" y2="373" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="378.3333333333333" y="411" font-size="25" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">10</text><line x1="535.0" y1="358" x2="535.0" y2="373" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="535.0" y="411" font-size="25" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">100</text><line x1="174.4530064507777" y1="268" x2="174.4530064507777" y2="365" stroke="#526276" stroke-width="2" stroke-dasharray="4 4"/><circle cx="174.4530064507777" cy="268" r="8" fill="#00A79D"/><text x="174.4530064507777" y="246" font-size="25" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">1</text><text x="60" y="500" font-size="28" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">1) 5800 K  →  0.50 µm</text><line x1="294.0567254423046" y1="268" x2="294.0567254423046" y2="365" stroke="#526276" stroke-width="2" stroke-dasharray="4 4"/><circle cx="294.0567254423046" cy="268" r="8" fill="#00A79D"/><text x="294.0567254423046" y="246" font-size="25" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">2</text><text x="60" y="562" font-size="28" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">2) 1000 K  →  2.90 µm</text><line x1="375.9743955362241" y1="268" x2="375.9743955362241" y2="365" stroke="#526276" stroke-width="2" stroke-dasharray="4 4"/><circle cx="375.9743955362241" cy="268" r="8" fill="#00A79D"/><text x="375.9743955362241" y="246" font-size="25" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">3</text><text x="60" y="624" font-size="28" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">3) 300 K  →  9.66 µm</text><text x="300" y="450" font-size="28" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">λmax (µm)</text><text x="565" y="706" font-size="24" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">القيم محسوبة؛ النقاط لا تمثل منحنى بلانك</text><line x1="35" y1="758" x2="565" y2="758" stroke="#cbd5e1" stroke-width="2" stroke-dasharray=""/><text x="35" y="792" font-size="20" fill="#526276" direction="ltr" text-anchor="start" unicode-bidi="plaintext">NIST CODATA 2022, Wien wavelength consta