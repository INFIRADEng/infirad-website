<text x="377" y="454" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">درجة الحرارة (كلفن)</text>
<text x="96" y="108" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start" direction="ltr">لوغاريتم ثابت التوازن</text>
<text x="380" y="488" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">من معادلة فانت هوف: ln(K₂/K₁) = −(ΔH/R)·(1/T₂ − 1/T₁)، فينخفض الثابت كلما ارتفعت الحرارة.</text>
