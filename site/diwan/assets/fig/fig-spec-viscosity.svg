<text x="580.3" y="332" font-size="17" font-weight="700" fill="#1e3a5f" text-anchor="end">355 µPa·s</text>
<text x="740" y="370" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">100 °م</text>
<rect x="619.5" y="378" width="120.5" height="14" fill="#0a7a4a" fill-opacity="0.85" rx="6"/>
<text x="611.5" y="390" font-size="17" font-weight="700" fill="#0a7a4a" text-anchor="end">282 µPa·s</text>
<line x1="740" y1="424" x2="270" y2="424" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">550</text>
<text x="270" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">1100</text>
<text x="505" y="474" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">اللزوجة الديناميكية (µPa·s)</text>
<text x="380" y="508" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">1 mPa·s = 1000 µPa·s · الماء عند 20 °م = 1.002 mPa·s</text>
</g></svg>
