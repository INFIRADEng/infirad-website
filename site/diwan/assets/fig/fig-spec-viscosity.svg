<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img" aria-labelledby="t">
<title id="t">لزوجة الماء الديناميكية مقابل الحرارة</title>
<rect width="760" height="534" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">لزوجة الماء الديناميكية مقابل الحرارة</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الماء عند ضغط جوي · الوحدة mPa·s</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الهبوط 3.6 مرة بين 20 و100 °م</text>
