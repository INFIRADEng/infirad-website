<text x="453" y="216" font-size="17" font-weight="700" fill="#0e7490" text-anchor="end">653 µPa·s</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">60 °م</text>
