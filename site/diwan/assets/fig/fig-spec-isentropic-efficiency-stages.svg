<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t">
<title id="t">كفاءة أيزونتروبية إرشادية للآلات الدوّارة</title>
<rect width="760" height="476" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">كفاءة أيزونتروبية إرشادية للآلات الدوّارة</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">نقطة التصميم للآلات الكبيرة</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الفاقد يظهر حرارةً في المائع لا شغلًا</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ضاغط محوري</text>
<rect x="280.4" y="146" width="459.6" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="270.4" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨88 %⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ضاغط طرد مركزي</text>
<rect x="311.8" y="204" width="428.2" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="301.8" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨82 %⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">توربين غازي</text>
<rect x="270" y="262" width="470" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="260" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨90 %⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">توربين بخاري</text>
<rect x="285.7" y="320" width="454.3" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="275.7" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨87 %⁩</text>
<line x1="740" y1="366" x2="270" y2="366" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">45</text>
<text x="270" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">90</text>
<text x="505" y="416" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الكفاءة الأيزونتروبية (%)</text>
<text x="380" y="450" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">خارج نقطة التصميم تنخفض إلى 0.70–0.80 — والكفاءة ليست ثابتة على منحنى الأداء</text>
</g></svg>
