<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t">
<title id="t">أثر معامل الحمل على التدفق الحراري</title>
<rect width="760" height="476" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">أثر معامل الحمل على التدفق الحراري</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">هواء ساكن (5)</text>
<rect x="735.3" y="146" width="4.7" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="725.3" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨75 W/m²⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">هواء متحرّك (25)</text>
<rect x="716.5" y="204" width="23.5" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="706.5" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨375 W/m²⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ماء طبيعي (100)</text>
<rect x="646" y="262" width="94" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="636" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨1500 W/m²⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ماء مضغوط (500)</text>
<rect x="270" y="320" width="470" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="260" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨7500 W/m²⁩</text>
<line x1="740" y1="366" x2="270" y2="366" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">3750</text>
<text x="270" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">7500</text>
<text x="505" y="416" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">التدفق الحراري عند فرق 15 كلفن (واط/م²)</text>
<text x="380" y="450" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">q = h·ΔT عند ΔT = 15 كلفن؛ القيم نطاقات إرشادية.</text>
</g></svg>
