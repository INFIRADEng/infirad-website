<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t">
<title id="t">تمدد 10 أمتار عند ارتفاع 40 كلفن</title>
<rect width="760" height="476" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">تمدد 10 أمتار عند ارتفاع 40 كلفن</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ΔL = α·L₀·ΔT — الطول نفسه وفرق الحرارة نفسه</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">المتغيّر الوحيد هو معامل التمدد α</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ألمنيوم α = 23×10⁻⁶</text>
<rect x="270" y="146" width="470" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="260" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨9.2 مليمتر⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">فولاذ α = 11.7×10⁻⁶</text>
<rect x="499.9" y="204" width="240.1" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="489.9" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨4.7 مليمتر⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">زجاج α = 9×10⁻⁶</text>
<rect x="556.1" y="262" width="183.9" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="546.1" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨3.6 مليمتر⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">إنفار α = 1.2×10⁻⁶</text>
<rect x="714.5" y="320" width="25.5" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="704.5" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨0.5 مليمتر⁩</text>
<line x1="740" y1="366" x2="270" y2="366" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">4.6</text>
<text x="270" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">9.2</text>
<text x="505" y="416" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الاستطالة في 10 أمتار (مم)</text>
<text x="380" y="450" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">سكة فولاذ 10 م تتمدد 4.7 مم؛ ولو مُنع التمدد تولّد إجهاد 94 ميجاباسكال بنفس الفرق</text>
</g></svg>
