<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-labelledby="t">
<title id="t">طبقات جدار ومقاومتها الحرارية</title>
<rect width="760" height="434" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">طبقات جدار ومقاومتها الحرارية</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">المقاومة تُجمع تواليًا: R = سماكة ÷ موصلية</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الطبقة الأعلى مقاومةً هي التي تُحدّد الأداء</text>
<rect x="80" y="140" width="600" height="50" fill="#5d7079" fill-opacity="0.14" stroke="#5d7079" stroke-opacity="0.45"/>
<text x="664" y="169" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">جبس داخلي 12 مم</text>
<text x="96" y="169" font-size="17" font-weight="600" fill="#5d7079" text-anchor="end">⁨0.06 m²·K/W⁩</text>
<rect x="80" y="196" width="600" height="50" fill="#0e7490" fill-opacity="0.14" stroke="#0e7490" stroke-opacity="0.45"/>
<text x="664" y="225" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">عزل صوف صخري 50 مم</text>
<text x="96" y="225" font-size="17" font-weight="600" fill="#0e7490" text-anchor="end">⁨1.35 m²·K/W⁩</text>
<rect x="80" y="252" width="600" height="50" fill="#c2410c" fill-opacity="0.14" stroke="#c2410c" stroke-opacity="0.45"/>
<text x="664" y="281" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">طوب أسمنتي 200 مم</text>
<text x="96" y="281" font-size="17" font-weight="600" fill="#c2410c" text-anchor="end">⁨0.147 m²·K/W⁩</text>
<rect x="80" y="308" width="600" height="50" fill="#a16207" fill-opacity="0.14" stroke="#a16207" stroke-opacity="0.45"/>
<text x="664" y="337" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">حجر خارجي 30 مم</text>
<text x="96" y="337" font-size="17" font-weight="600" fill="#a16207" text-anchor="end">⁨0.05 m²·K/W⁩</text>
<text x="380" y="408" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">العزل 1.35 من أصل 1.61 = 84% من المقاومة الكلية · السماكة ليست بمقياس</text>
</g></svg>
