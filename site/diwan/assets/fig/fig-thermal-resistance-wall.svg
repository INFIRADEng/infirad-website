<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t">
<title id="t">أين تسكن المقاومة الحرارية في جدار</title>
<rect width="760" height="476" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">أين تسكن المقاومة الحرارية في جدار</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">طوب 100 مم (k = 0.60) وصوف صخري 100 مم (k = 0.04)</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">المقاومة النوعية بالمتر المربع وكلفن: 0.167 مقابل 2.50</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">فيلم الهواء الداخلي</text>
<rect x="715.6" y="146" width="24.4" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="705.6" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨0.13 م²·كلفن/واط⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">طوب 100 مم</text>
<rect x="708.6" y="204" width="31.4" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="698.6" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨0.17 م²·كلفن/واط⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">صوف صخري 100 مم</text>
<rect x="270" y="262" width="470" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="260" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨2.5 م²·كلفن/واط⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">فيلم الهواء الخارجي</text>
<rect x="732.5" y="320" width="7.5" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="722.5" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨0.04 م²·كلفن/واط⁩</text>
<line x1="740" y1="366" x2="270" y2="366" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">1.25</text>
<text x="270" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">2.5</text>
<text x="505" y="416" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">المقاومة النوعية R (م²·كلفن/واط)</text>
<text x="380" y="450" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الصوف يسهم بنسبة 88% من المقاومة الكلية والطوب بنسبة 6% — فالعزل قرار مقاومة لا سماكة</text>
</g></svg>
