<svg xmlns="http://www.w3.org/2000/svg" width="760" height="568" viewBox="0 0 760 568" role="img" aria-labelledby="t">
<title id="t">الحد الأدنى لبخار التسخين مقابل فرق الحرارة الأدنى</title>
<rect width="760" height="568" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">الحد الأدنى لبخار التسخين مقابل فرق الحرارة الأدنى</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">10 كلفن</text>
<rect x="665.2" y="146" width="74.8" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="655.2" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨35 kW⁩</text>
<text x="740" y="188" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">15 كلفن</text>
<rect x="606.5" y="196" width="133.5" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="596.5" y="208" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨62.5 kW⁩</text>
<text x="740" y="238" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">20 كلفن</text>
<rect x="547.7" y="246" width="192.3" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="537.7" y="258" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨90 kW⁩</text>
<text x="740" y="288" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">25 كلفن</text>
<rect x="489" y="296" width="251" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="479" y="308" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨117.5 kW⁩</text>
<text x="740" y="338" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">30 كلفن</text>
<rect x="430.2" y="346" width="309.8" height="14" fill="#0a7a4a" fill-opacity="0.85" rx="6"/>
<text x="420.2" y="358" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨145 kW⁩</text>
<text x="740" y="388" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">40 كلفن</text>
<rect x="312.7" y="396" width="427.3" height="14" fill="#7c3aed" fill-opacity="0.85" rx="6"/>
<text x="302.7" y="408" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨200 kW⁩</text>
<line x1="740" y1="434" x2="270" y2="434" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="458" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="458" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">110</text>
<text x="270" y="458" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">220</text>
<text x="505" y="484" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">فرق الحرارة الأدنى بين التيارين المتلامسين (كلفن) — والقيمة هي البخار الأدنى بالكيلوواط</text>
<text x="380" y="518" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">شبكة المثال: H1 180←80 وH2 130←50 وC1 40→150 وC2 70→140 بمعدلات 2.0 و4.0 و2.5 و3.0 كيلوواط/كلفن</text>
<text x="380" y="542" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">المحسوب بجدول المشكلة: البخار = 5.5 × الفرق الأدنى − 20 لهذه التيارات، والعلاقة تنكسر إذا تغيرت نقطة التقارب</text>
</g></svg>
