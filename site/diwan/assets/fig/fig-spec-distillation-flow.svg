<text x="235" y="226" font-size="17" font-weight="600" fill="#0e7490" text-anchor="middle">⁨78.2 °م⁩</text>
<rect x="415" y="320" width="220" height="72" rx="8" fill="#a16207" fill-opacity="0.12" stroke="#a16207" stroke-width="1.5"/>
<text x="525" y="350" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">مكثّف ومرتجع</text>
<text x="525" y="376" font-size="17" font-weight="600" fill="#a16207" text-anchor="middle">⁨78.2 °م⁩</text>
