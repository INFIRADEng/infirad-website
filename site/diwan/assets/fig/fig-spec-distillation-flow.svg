<path d="M525,316 l-7,-13 l14,0 z" fill="#5d7079"/>
<text x="380" y="434" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">أدنى عدد أطباق نظرية 6.4 لخليط تطايره النسبي 2.5، وتبخير كيلوغرام ماء يحتاج 2256 كيلوجول.</text>
