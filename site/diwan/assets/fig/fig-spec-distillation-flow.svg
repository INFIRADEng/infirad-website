<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">نقاط الحرارة في برج تقطير إيثانول وماء</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">درجة القمة تساوي درجة الأزيوتروب 78.2 °م عند الضغط الجوي</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">التكرار داخل العمود هو ما يرفع النقاء، لا التبخير مرة واحدة</text>
