<text x="235" y="350" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">قاع البرج</text>
<text x="235" y="376" font-size="17" font-weight="600" fill="#1e3a5f" text-anchor="middle">⁨100 °م⁩</text>
