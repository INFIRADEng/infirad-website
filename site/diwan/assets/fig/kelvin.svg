<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc"><title id="title">الكلفن والدرجة المئوية</title><desc id="desc">مقياسان لهما تدرج متساوٍ؛ الفرق 100 كلفن يساوي فرق 100 درجة مئوية، مع اختلاف نقطة الصفر.</desc><style>text{font-family:Arial,"Noto Sans Arabic",sans-serif}</style><rect width="600" height="800" fill="white"/><text x="565" y="58" font-size="32" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">الكلفن والدرجة المئوية</text><line x1="35" y1="86" x2="565" y2="86" stroke="#cbd5e1" stroke-width="2" stroke-dasharray=""/><text x="565" y="130" font-size="28" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نقطة البداية تختلف؛ حجم الدرجة واحد</text><line x1="65" y1="280" x2="535" y2="280" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><line x1="65" y1="460" x2="535" y2="460" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><line x1="65.0" y1="273" x2="65.0" y2="287" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><line x1="65.0" y1="453" x2="65.0" y2="467" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="65.0" y="322" font-size="24" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">0</text><text x="65.0" y="502" font-size="22" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">-273.15</text><line x1="182.5" y1="273" x2="182.5" y2="287" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><line x1="182.5" y1="453" x2="182.5" y2="467" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="182.5" y="322" font-size="24" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">100</text><text x="182.5" y="502" font-size="22" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">-173.15</text><line x1="300.0" y1="273" x2="300.0" y2="287" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><line x1="300.0" y1="453" x2="300.0" y2="467" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="300.0" y="322" font-size="24" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">200</text><text x="300.0" y="502" font-size="22" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">-73.15</text><line x1="417.5" y1="273" x2="417.5" y2="287" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><line x1="417.5" y1="453" x2="417.5" y2="467" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="417.5" y="322" font-size="24" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">300</text><text x="417.5" y="502" font-size="22" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">26.85</text><line x1="535.0" y1="273" x2="535.0" y2="287" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><line x1="535.0" y1="453" x2="535.0" y2="467" stroke="#001F3F" stroke-width="2" stroke-dasharray=""/><text x="535.0" y="322" font-size="24" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">400</text><text x="535.0" y="502" font-size="22" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">126.85</text><line x1="385.95124999999996" y1="250" x2="385.95124999999996" y2="460" stroke="#526276" stroke-width="2" stroke-dasharray="5 5"/><line x1="503.45124999999996" y1="250" x2="503.45124999999996" y2="460" stroke="#526276" stroke-width="2" stroke-dasharray="5 5"/><text x="35" y="220" font-size="28" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">T (K)</text><text x="35" y="405" font-size="28" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">t (°C)</text><text x="300" y="180" font-size="28" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">t = T − 273.15</text><text x="300" y="560" font-size="28" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">273.15 K = 0 °C</text><text x="300" y="610" font-size="28" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">373.15 K = 100 °C</text><text x="300" y="662" font-size="28" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">ΔT = 100 K = 100 °C</text><line x1="35" y1="718" x2="565" y2="718" stroke="#cbd5e1" stroke-width="2" stroke-dasharray=""/><text x="35" y="752" font-size="20" fill="#526276" direction="ltr" text-anchor="start" unicode-bidi="plaintext">BIPM SI Brochure, 9th ed., §2.3.1</text><text x="565" y="782" font-size="20" fill="#526276" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رسم تعليمي أصلي — انفراد</text></svg>