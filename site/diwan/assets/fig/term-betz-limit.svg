<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" role="img" aria-labelledby="t">
<title id="t">حدّ بيتز: سقف لا يُتجاوز مهما حسّنت الشفرة</title>
<rect width="760" height="394" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">حدّ بيتز: سقف لا يُتجاوز مهما حسّنت الشفرة</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">Cp,max = 16/27 = 0.5926 من طاقة الريح المتاحة</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ريح 10 م/ث على مقطع 100 م² (قطر 11.3 م) وكثافة 1.225 kg/m³</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">الطاقة المتاحة</text>
<rect x="270" y="146" width="470" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="260" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨61.25 kW⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">حدّ بيتز (59.26%)</text>
<rect x="461.5" y="204" width="278.5" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="451.5" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨36.3 kW⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">توربين حقيقي (Cp = 0.40)</text>
<rect x="552" y="262" width="188" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="542" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨24.5 kW⁩</text>
<line x1="740" y1="308" x2="270" y2="308" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">30.63</text>
<text x="270" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">61.25</text>
<text x="380" y="368" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الفرق بين 0.40 و0.59.26 هو ما يدفع هندسة الشفرات — لا المحرّك</text>
</g></svg>
