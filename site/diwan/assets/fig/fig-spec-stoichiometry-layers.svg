<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-labelledby="t">
<title id="t">كتل الدخول والخروج في تكوين الماء</title>
<rect width="760" height="434" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">كتل الدخول والخروج في تكوين الماء</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">من 5.00 غرام هيدروجين و32.0 غرام أكسجين، والأكسجين هو المحدّد</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">يحتاج الأكسجين إلى 2.000 مول هيدروجين، والمتاح 2.480</text>
<rect x="80" y="140" width="600" height="50" fill="#0e7490" fill-opacity="0.14" stroke="#0e7490" stroke-opacity="0.45"/>
<text x="664" y="169" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">الهيدروجين الداخل</text>
<text x="96" y="169" font-size="17" font-weight="600" fill="#0e7490" text-anchor="end">⁨5 غرام⁩</text>
<rect x="80" y="196" width="600" height="50" fill="#1e3a5f" fill-opacity="0.14" stroke="#1e3a5f" stroke-opacity="0.45"/>
<text x="664" y="225" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">الأكسجين الداخل</text>
<text x="96" y="225" font-size="17" font-weight="600" fill="#1e3a5f" text-anchor="end">⁨32 غرام⁩</text>
<rect x="80" y="252" width="600" height="50" fill="#0a7a4a" fill-opacity="0.14" stroke="#0a7a4a" stroke-opacity="0.45"/>
<text x="664" y="281" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">الماء الخارج</text>
<text x="96" y="281" font-size="17" font-weight="600" fill="#0a7a4a" text-anchor="end">⁨36.03 غرام⁩</text>
<rect x="80" y="308" width="600" height="50" fill="#a16207" fill-opacity="0.14" stroke="#a16207" stroke-opacity="0.45"/>
<text x="664" y="337" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">الهيدروجين الفائض</text>
<text x="96" y="337" font-size="17" font-weight="600" fill="#a16207" text-anchor="end">⁨0.968 غرام⁩</text>
<text x="380" y="408" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">كتلة الهيدروجين الداخلة أصغر ومع ذلك هو الفائض، لأن المقارنة بالمولات مقسومة على المعاملات.</text>
</g></svg>
