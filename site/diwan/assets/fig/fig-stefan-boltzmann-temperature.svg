<title id="t">الإشعاع يتضاعف مع الأس الرابع</title>
<rect width="760" height="476" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">الإشعاع يتضاعف مع الأس الرابع</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">سطح بانبعاثية 0.9 إلى محيط 20 °م</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">q″ = ε·σ·(Tₛ⁴ − Tₘ⁴)</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">سطح 40 °م</text>
