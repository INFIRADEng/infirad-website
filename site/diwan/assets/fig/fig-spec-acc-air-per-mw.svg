<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" viewBox="0 0 760 524" role="img" aria-labelledby="t">
<title id="t">كتلة الهواء اللازمة لكل ميغاواط مطرود</title>
<rect width="760" height="524" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">كتلة الهواء اللازمة لكل ميغاواط مطرود</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">حرارة نوعية 1.015 كيلوجول/(كغم·كلفن) وهواء جاف</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ارتفاع 10 كلفن</text>
<rect x="277.1" y="146" width="463" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="267.1" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨98.5 كغم/ث⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ارتفاع 14 كلفن</text>
<rect x="409.1" y="204" width="330.9" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="399.1" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨70.4 كغم/ث⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ارتفاع 16 كلفن</text>
<rect x="450.5" y="262" width="289.5" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="440.5" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨61.6 كغم/ث⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ارتفاع 20 كلفن</text>
<rect x="508.3" y="320" width="231.7" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="498.3" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨49.3 كغم/ث⁩</text>
<line x1="740" y1="366" x2="270" y2="366" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">50</text>
<text x="270" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">100</text>
<text x="380" y="416" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">لكل ميغاواط مطرود: كتلة الهواء في الثانية</text>
<text x="380" y="440" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">من m = Q / (cp · ΔT) بطرد 1,000 كيلوواط</text>
<text x="380" y="474" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">رفع ارتفاع حرارة الهواء يقلّص تدفقه ويقصّر السطح،</text>
<text x="380" y="498" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">لكنه يرفع حرارة التكثيف وضغط التشبّع معها</text>
</g></svg>
