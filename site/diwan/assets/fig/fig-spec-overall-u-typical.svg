<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t">
<title id="t">قيم إرشادية لمعامل الانتقال الكلي</title>
<rect width="760" height="476" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">قيم إرشادية لمعامل الانتقال الكلي</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">مبادلات نظيفة عند نقطة التصميم</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الغاز هو الذي يخفض U لا المعدن</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">هواء إلى هواء</text>
<rect x="734.4" y="146" width="5.6" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="724.4" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨30 واط/(متر مربع·كلفن)⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ماء إلى هواء (زعانف)</text>
<rect x="711.8" y="204" width="28.2" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="701.8" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨150 واط/(متر مربع·كلفن)⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ماء إلى ماء</text>
<rect x="552" y="262" width="188" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="542" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨1000 واط/(متر مربع·كلفن)⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">بخار متكثف إلى ماء</text>
<rect x="270" y="320" width="470" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="260" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨2500 واط/(متر مربع·كلفن)⁩</text>
<line x1="740" y1="366" x2="270" y2="366" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">1250</text>
<text x="270" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">2500</text>
<text x="505" y="416" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">معامل الانتقال الكلي U</text>
<text x="380" y="450" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الفارق بين 30 و2500 أي 83 ضعفًا، سببه معامل الغشاء الغازي وحده</text>
</g></svg>
