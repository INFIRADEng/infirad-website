<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418" role="img" aria-labelledby="t">
<title id="t">عدد نوسلت بثلاثة موائع عند الرقم نفسه</title>
<rect width="760" height="418" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">عدد نوسلت بثلاثة موائع عند الرقم نفسه</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">Dittus–Boelter لأنبوب أملس في التسخين</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">Re = 10,000 والقطر نفسه والسرعة القطرية نفسها</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">هواء (Pr 0.71)</text>
<rect x="694.7" y="146" width="45.3" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="684.7" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨32 بلا وحدة⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ماء (Pr 7.0)</text>
<rect x="628.2" y="204" width="111.8" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="618.2" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨79 بلا وحدة⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">زيت (Pr 250)</text>
<rect x="270" y="262" width="470" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="260" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨332 بلا وحدة⁩</text>
<line x1="740" y1="308" x2="270" y2="308" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">166</text>
<text x="270" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">332</text>
<text x="505" y="358" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">عدد نوسلت</text>
<text x="380" y="392" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">Nu = 0.023 Re^0.8 Pr^0.4 — الزيادة كلها من برانتل لا من السرعة</text>
</g></svg>
