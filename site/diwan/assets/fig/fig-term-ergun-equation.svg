<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" role="img" aria-labelledby="t">
<title id="t">معادلة إرغن لسقوط الضغط في الحشوة</title>
<rect width="760" height="336" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">معادلة إرغن لسقوط الضغط في الحشوة</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">معامل الحدّ اللزج في معادلة إرغن</text>
<rect x="348.3" y="146" width="391.7" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="338.3" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨150⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">معامل الحدّ اللزج في معادلة كارما…</text>
<rect x="270" y="204" width="470" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="260" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨180⁩</text>
<line x1="740" y1="250" x2="270" y2="250" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">90</text>
<text x="270" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">180</text>
<text x="505" y="300" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">القيم المرجعية مجرّدة (أعداد بلا وحدة) — مأخوذة من النص</text>
</g></svg>
