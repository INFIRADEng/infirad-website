<text x="380.0" y="424.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="middle">الرياض 0.031 · أسوان 0.00025 · الربع الخالي 0.009 · غوبي 0.097 · القطب الجنوبي 0.225</text>
<text x="380.0" y="446.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="middle">القطب الجنوبي صحراء جليدية: قلّة المطر آليتها البرودة لا الحرارة — لا يُعدّ صحراءً حارّة</text>
