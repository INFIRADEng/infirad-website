<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="t">
<title id="t">مؤشّر الجفاف في الصحراء</title>
<rect width="760" height="500" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">مؤشّر الجفاف في الصحراء</text>
<text x="380" y="60" font-size="17" fill="#5d7079" text-anchor="middle">مؤشّر الجفاف = المطر ⁄ التبخّر الكامن خلال سنة</text>
<text x="380" y="84" font-size="17" fill="#5d7079" text-anchor="middle">كل ما هو دون 0.20 يُعدّ جافًّا، ودون 0.05 صحراويًّا شديدًا</text>
<rect x="250" y="128" width="378" height="244" fill="#ffffff" stroke="#cbd5d9" stroke-width="1"/>
<text x="236.0" y="166.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">الرياض</text>
<rect x="250" y="152.0" width="29.1" height="18" fill="#c2410c" fill-opacity="0.65"/>
<text x="638.0" y="166.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0.031</text>
<text x="236.0" y="212.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">أسوان</text>
<rect x="250" y="198.0" width="3.0" height="18" fill="#c2410c" fill-opacity="0.65"/>
<text x="638.0" y="212.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0.000</text>
<text x="236.0" y="258.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">الربع الخالي</text>
<rect x="250" y="244.0" width="8.4" height="18" fill="#c2410c" fill-opacity="0.65"/>
<text x="638.0" y="258.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0.009</text>
<text x="236.0" y="304.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">غوبي</text>
<rect x="250" y="290.0" width="91.7" height="18" fill="#a16207" fill-opacity="0.65"/>
<text x="638.0" y="304.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0.097</text>
<text x="236.0" y="350.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">القطب الجنوبي</text>
<rect x="250" y="336.0" width="212.6" height="18" fill="#0e7490" fill-opacity="0.65"/>
<text x="638.0" y="350.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0.225</text>
<line x1="297.3" y1="128.0" x2="297.3" y2="372.0" stroke="#5d7079" stroke-width="1" stroke-dasharray="4 3"/>
<text x="297.3" y="116.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">0.05</text>
<line x1="439.0" y1="128.0" x2="439.0" y2="372.0" stroke="#5d7079" stroke-width="1" stroke-dasharray="4 3"/>
<text x="439.0" y="116.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">0.20</text>
<text x="380.0" y="448.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الرياض 0.031 · أسوان 0.00025 · الربع الخالي 0.009 · غوبي 0.097 · القطب الجنوبي 0.225</text>
<text x="380.0" y="474.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">القطب الجنوبي صحراء جليدية: قلّة المطر آليتها البرودة لا الحرارة — لا يُعدّ صحراءً حارّة</text>
</g></svg>