<title id="t">مؤشّر الجفاف في الصحراء</title>
<rect width="760" height="470" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif">
<text x="380" y="32" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">مؤشّر الجفاف في الصحراء</text>
<text x="380" y="56" font-size="12.5" fill="#5d7079" text-anchor="middle">مؤشّر الجفاف = المطر ⁄ التبخّر الكامن خلال سنة</text>
<text x="380" y="74" font-size="12" fill="#5d7079" text-anchor="middle">كل ما هو دون 0.20 يُعدّ جافًّا، ودون 0.05 صحراويًّا شديدًا</text>
