<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="t">
<title id="t">مقاييس الخلية</title>
<rect width="760" height="470" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif">
<text x="380" y="32" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">مقاييس الخلية</text>
<text x="380" y="56" font-size="12.5" fill="#5d7079" text-anchor="middle">الحجم على مقياس لوغاريتمي — من جزيء البروتين إلى الخلية العصبية</text>
<text x="380" y="74" font-size="12" fill="#5d7079" text-anchor="middle">نسبة السطح إلى الحجم تساوي 6 ⁄ d للكرة: كلما كبرت الخلية ضاق التبادل</text>
<rect x="258" y="112" width="432" height="316" fill="#ffffff" stroke="#cbd5d9" stroke-width="1"/>
<text x="244.0" y="152.0" font-size="12.5" font-weight="400" fill="#1b2a2f" text-anchor="end">جزيء بروتين</text>
<rect x="258" y="138.0" width="16.0" height="18" fill="#5d7079" fill-opacity="0.65"/>
<text x="286.0" y="152.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="start">0.01 µm</text>
<text x="244.0" y="202.0" font-size="12.5" font-weight="400" fill="#1b2a2f" text-anchor="end">فيروس</text>
<rect x="258" y="188.0" width="96.0" height="18" fill="#a16207" fill-opacity="0.65"/>
<text x="366.0" y="202.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="start">0.1 µm</text>
<text x="244.0" y="252.0" font-size="12.5" font-weight="400" fill="#1b2a2f" text-anchor="end">بكتيريا</text>
<rect x="258" y="238.0" width="176.0" height="18" fill="#0e7490" fill-opacity="0.65"/>
<text x="446.0" y="252.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="start">1 µm</text>
<text x="244.0" y="302.0" font-size="12.5" font-weight="400" fill="#1b2a2f" text-anchor="end">خلية حقيقية النواة</text>
<rect x="258" y="288.0" width="280.1" height="18" fill="#c2410c" fill-opacity="0.65"/>
<text x="550.1" y="302.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="start">20 µm</text>
<text x="244.0" y="352.0" font-size="12.5" font-weight="400" fill="#1b2a2f" text-anchor="end">بويضة بشرية</text>
<rect x="258" y="338.0" width="342.3" height="18" fill="#c2410c" fill-opacity="0.65"/>
<text x="612.3" y="352.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="start">120 µm</text>
<text x="244.0" y="402.0" font-size="12.5" font-weight="400" fill="#1b2a2f" text-anchor="end">خلية عصبية</text>
<rect x="258" y="388.0" width="416.0" height="18" fill="#1b2a2f" fill-opacity="0.65"/>
<text x="686.0" y="402.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="start">1 مم</text>
<text x="380.0" y="424.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="middle">ريبوسوم قطر 20 نانومترًا — أصغر تركيب وظيفي داخل الخلية</text>
<text x="380.0" y="446.0" font-size="11.5" font-weight="400" fill="#5d7079" text-anchor="middle">الخلية البدائية النواة بلا نواة محاطة بغشاء؛ الحقيقية بنواة وعضيّات</text>
</g></svg>