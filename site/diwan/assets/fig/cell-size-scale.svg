<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="t">
<title id="t">مقاييس الخلية</title>
<rect width="760" height="500" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">مقاييس الخلية</text>
<text x="380" y="60" font-size="17" fill="#5d7079" text-anchor="middle">الحجم على مقياس لوغاريتمي — من جزيء البروتين إلى الخلية العصبية</text>
<text x="380" y="84" font-size="17" fill="#5d7079" text-anchor="middle">نسبة السطح إلى الحجم تساوي 6 ⁄ d للكرة: كلما كبرت الخلية ضاق التبادل</text>
<rect x="258" y="128" width="432" height="316" fill="#ffffff" stroke="#cbd5d9" stroke-width="1"/>
<text x="244.0" y="168.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">جزيء بروتين</text>
<rect x="258" y="154.0" width="16.0" height="18" fill="#5d7079" fill-opacity="0.65"/>
<text x="286.0" y="168.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0.01 µm</text>
<text x="244.0" y="218.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">فيروس</text>
<rect x="258" y="204.0" width="96.0" height="18" fill="#a16207" fill-opacity="0.65"/>
<text x="366.0" y="218.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0.1 µm</text>
<text x="244.0" y="268.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">بكتيريا</text>
<rect x="258" y="254.0" width="176.0" height="18" fill="#0e7490" fill-opacity="0.65"/>
<text x="446.0" y="268.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">1 µm</text>
<text x="244.0" y="318.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">خلية حقيقية النواة</text>
<rect x="258" y="304.0" width="280.1" height="18" fill="#c2410c" fill-opacity="0.65"/>
<text x="550.1" y="318.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">20 µm</text>
<text x="244.0" y="368.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">بويضة بشرية</text>
<rect x="258" y="354.0" width="342.3" height="18" fill="#c2410c" fill-opacity="0.65"/>
<text x="612.3" y="368.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">120 µm</text>
<text x="244.0" y="418.0" font-size="17" font-weight="400" fill="#1b2a2f" text-anchor="end">خلية عصبية</text>
<rect x="258" y="404.0" width="416.0" height="18" fill="#1b2a2f" fill-opacity="0.65"/>
<text x="686.0" y="418.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">1 مم</text>
<text x="380.0" y="448.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ريبوسوم قطر 20 نانومترًا — أصغر تركيب وظيفي داخل الخلية</text>
<text x="380.0" y="474.0" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الخلية البدائية النواة بلا نواة محاطة بغشاء؛ الحقيقية بنواة وعضيّات</text>
</g></svg>