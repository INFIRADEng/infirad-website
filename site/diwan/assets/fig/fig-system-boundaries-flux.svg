<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418" role="img" aria-labelledby="t">
<title id="t">ما يعبر حدود ثلاثة أنواع من الأنظمة</title>
<rect width="760" height="418" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">ما يعبر حدود ثلاثة أنواع من الأنظمة</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">حرارة Q · شغل W · كتلة m عند الحد</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">المفتوح يعبره الثلاثة، والمغلق يعبره Q وW فقط</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">معزول</text>
<rect x="738" y="146" width="2" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="728" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨0 عدد أنواع العبور⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">مغلق</text>
<rect x="426.7" y="204" width="313.3" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="416.7" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨2 عدد أنواع العبور⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">مفتوح</text>
<rect x="270" y="262" width="470" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="260" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨3 عدد أنواع العبور⁩</text>
<line x1="740" y1="308" x2="270" y2="308" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">1.5</text>
<text x="270" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">3</text>
<text x="505" y="358" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">أنواع العبور الممكنة عبر الحد</text>
<text x="380" y="392" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">التصنيف وصف لحدود التحليل لا للمعدّة: التوربين مفتوح، والغاز في أسطوانة مغلقة مغلق</text>
</g></svg>
