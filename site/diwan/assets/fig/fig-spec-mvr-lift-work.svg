<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="t">
<title id="t">شغل الضاغط مقابل فرق درجة التشبّع</title>
<rect width="760" height="640" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">شغل الضاغط مقابل فرق درجة التشبّع</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">2.49 كلفن</text>
