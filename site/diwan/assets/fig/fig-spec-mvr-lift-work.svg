<line x1="740" y1="434" x2="270" y2="434" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="458" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="458" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">82.5</text>
<text x="270" y="458" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">165</text>
<text x="380" y="484" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الشغل على عمود الضاغط (كيلوجول/كغ)</text>
<text x="380" y="508" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">القيم بجانب الأعمدة: فرق درجة التشبّع (كلفن)</text>
<text x="380" y="542" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الأساس: بخار مشبع عند 1.1 بار (102.32 °م)، وk = 1.34، وكفاءة أيزونتروبية 0.75،</text>
<text x="380" y="566" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">وضغوط التشبّع من جدول البخار المشبع.</text>
<text x="380" y="590" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الشغل 8.23 كيلوجول/كغ لكل كلفن إضافي في هذا المدى،</text>
<text x="380" y="614" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">والعلاقة تنحني لأعلى عند الفروق الكبيرة.</text>
</g></svg>
