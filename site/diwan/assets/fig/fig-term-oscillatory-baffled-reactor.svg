<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" role="img" aria-labelledby="t">
<title id="t">مفاعل الحواجز التذبذبي</title>
<rect width="760" height="394" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">مفاعل الحواجز التذبذبي</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">أدنى رقم رينولدز تذبذب يلزم لانفص…</text>
<rect x="735.3" y="146" width="4.7" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="725.3" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨50⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">أعلى رقم رينولدز تذبذب يلزم لانفص…</text>
<rect x="730.6" y="204" width="9.4" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="720.6" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨100⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">رقم رينولدز التذبذب الذي يعمل عند…</text>
<rect x="270" y="262" width="470" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="260" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨5000⁩</text>
<line x1="740" y1="308" x2="270" y2="308" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">2500</text>
<text x="270" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">5000</text>
<text x="505" y="358" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">القيم المرجعية بوحدة بلا بُعد — مأخوذة من النص</text>
</g></svg>
