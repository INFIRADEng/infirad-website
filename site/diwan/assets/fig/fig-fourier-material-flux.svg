<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t">
<title id="t">التدفق الحراري في 100 مم عند فرق 20 كلفن</title>
<rect width="760" height="476" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">التدفق الحراري في 100 مم عند فرق 20 كلفن</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">q″ = k·ΔT/L — الفرق والسماكة ثابتان</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">المتغيّر الوحيد هو الموصلية الحرارية k</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">صوف صخري k = 0.040</text>
<rect x="738" y="146" width="2" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="728" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨8 واط/م²⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">هواء ساكن k = 0.026</text>
<rect x="738" y="204" width="2" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="728" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨5 واط/م²⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">طوب k = 0.60</text>
<rect x="734.4" y="262" width="5.6" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="724.4" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨120 واط/م²⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">فولاذ k = 50</text>
<rect x="270" y="320" width="470" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="260" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨10000 واط/م²⁩</text>
<line x1="740" y1="366" x2="270" y2="366" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">5000</text>
<text x="270" y="390" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">10000</text>
<text x="505" y="416" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">التدفق الحراري (واط/م²)</text>
<text x="380" y="450" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">مقياس عمودي خطي: الفولاذ يمرّر ما يعادل 83 ضعف الطوب في السماكة والفرق نفسيهما</text>
</g></svg>
