<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t">
<title id="t">مخطط مسار الطاقة في البناء الضوئي</title>
<g font-family="inherit" direction="rtl"><defs><marker id="ar3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker></defs><text x="380" y="26" font-size="16" fill="#1b2a2f" text-anchor="middle" font-weight="700" direction="rtl">البناء الضوئي: تحويل طاقة الفوتون إلى طاقة كيميائية مختزنة</text><rect x="40" y="120" width="190" height="72" rx="8" fill="#e6f2f5" stroke="#cbd5d9"/><text x="135" y="147" font-size="13.5" fill="#1b2a2f" text-anchor="middle" font-weight="600" direction="rtl">فوتونات 400–700 نانومتر</text><text x="135" y="172" font-size="10.5" fill="#5d7079" text-anchor="middle"  direction="rtl">2 H₂O ⇒ O₂ + 4 H⁺ + 4 e⁻</text><rect x="285" y="60" width="190" height="72" rx="8" fill="#fdeee6" stroke="#cbd5d9"/><text x="380" y="87" font-size="13.5" fill="#1b2a2f" text-anchor="middle" font-weight="600" direction="rtl">تفاعلات الضوء</text><text x="380" y="112" font-size="10.5" fill="#5d7079" text-anchor="middle"  direction="rtl">الثايلاكويد · PSII ثم PSI</text><rect x="285" y="190" width="190" height="72" rx="8" fill="#fdeee6" stroke="#cbd5d9"/><text x="380" y="217" font-size="13.5" fill="#1b2a2f" text-anchor="middle" font-weight="600" direction="rtl">سلسلة نقل الإلكترون</text><text x="380" y="242" font-size="10.5" fill="#5d7079" text-anchor="middle"  direction="rtl">ضخّ بروتونات ⇒ تدرّج pH</text><rect x="530" y="60" width="190" height="72" rx="8" fill="#eef7f2" stroke="#cbd5d9"/><text x="625" y="87" font-size="13.5" fill="#1b2a2f" text-anchor="middle" font-weight="600" direction="rtl">ATP + NADPH</text><text x="625" y="112" font-size="10.5" fill="#5d7079" text-anchor="middle"  direction="rtl">3 ATP و2 NADPH لكل CO₂</text><rect x="530" y="190" width="190" height="72" rx="8" fill="#eef7f2" stroke="#cbd5d9"/><text x="625" y="217" font-size="13.5" fill="#1b2a2f" text-anchor="middle" font-weight="600" direction="rtl">دورة كالفن</text><text x="625" y="242" font-size="10.5" fill="#5d7079" text-anchor="middle"  direction="rtl">RuBisCO يثبّت CO₂ على RuBP</text><line x1="230" y1="156" x2="285" y2="108" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ar3)"/><text x="257.5" y="124" font-size="11" fill="#c2410c" text-anchor="middle"  direction="rtl">امتصاص</text><line x1="380" y1="132" x2="380" y2="190" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ar3)"/><text x="380" y="153" font-size="11" fill="#c2410c" text-anchor="middle"  direction="rtl">e⁻</text><line x1="475" y1="96" x2="530" y2="96" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ar3)"/><text x="502.5" y="88" font-size="11" fill="#c2410c" text-anchor="middle"  direction="rtl">كمّ طاقة</text><line x1="475" y1="226" x2="530" y2="226" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ar3)"/><text x="502.5" y="218" font-size="11" fill="#c2410c" text-anchor="middle"  direction="rtl">ATP/NADPH</text><text x="380" y="316" font-size="13" fill="#1b2a2f" text-anchor="middle" font-weight="600" direction="rtl">المحصّلة: 6 CO₂ + 6 H₂O + ضوء ⇒ C₆H₁₂O₆ + 6 O₂</text><text x="380" y="344" font-size="11.5" fill="#5d7079" text-anchor="middle"  direction="rtl">المردود النظري ≈ 30% من طاقة الفوتون · والمقيس حقليًّا 3–6% من الإشعاع الكلي</text></g></svg>
