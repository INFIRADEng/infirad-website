<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img" aria-labelledby="t">
<title id="t">ضغط بخار الماء المشبع مع الحرارة</title>
<rect width="760" height="534" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">ضغط بخار الماء المشبع مع الحرارة</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">عند 4.25 كيلوباسكال عند 30 °م يصبح بخار الماء 4.2% من الضغط الجوي</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">نسبة بخار الماء في الهواء المشبع تزيد أُسّيًّا مع الحرارة</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">0 °م</text>
<rect x="701.1" y="146" width="38.9" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="691.1" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨0.61 كيلوباسكال⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">10 °م</text>
<rect x="661.8" y="204" width="78.2" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="651.8" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨1.23 كيلوباسكال⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">20 °م</text>
<rect x="591.1" y="262" width="148.9" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="581.1" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨2.34 كيلوباسكال⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">30 °م</text>
<rect x="469.7" y="320" width="270.3" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="459.7" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨4.25 كيلوباسكال⁩</text>
<text x="740" y="370" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">40 °م</text>
<rect x="270" y="378" width="470" height="14" fill="#0a7a4a" fill-opacity="0.85" rx="6"/>
<text x="260" y="390" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨7.38 كيلوباسكال⁩</text>
<line x1="740" y1="424" x2="270" y2="424" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">3.69</text>
<text x="270" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">7.38</text>
<text x="505" y="474" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ضغط البخار المشبع (كيلوباسكال)</text>
<text x="380" y="508" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">من 0 إلى 40 °م: الحرارة تزيد 40 كلفن والضغط المشبع يزيد 12 ضعفًا — فالرطوبة شأن حرارة لا شأن كتلة</text>
</g></svg>
