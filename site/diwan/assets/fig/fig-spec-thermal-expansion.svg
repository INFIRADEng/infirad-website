<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ألمنيوم</text>
<rect x="270" y="204" width="470" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="262" y="216" font-size="17" font-weight="700" fill="#0e7490" text-anchor="end">92 مم</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">خرسانة</text>
<rect x="535.7" y="262" width="204.3" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="527.7" y="274" font-size="17" font-weight="700" fill="#a16207" text-anchor="end">40 مم</text>
<line x1="740" y1="308" x2="270" y2="308" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">46</text>
<text x="270" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">92</text>
<text x="505" y="358" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الاستطالة (مليمتر)</text>
<text x="380" y="392" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">لو مُنع التمدد في الفولاذ لنشأ إجهاد ضغط 96 ميجاباسكال — قريب من ثلث مقاومة الخضوع.</text>
