<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418" role="img" aria-labelledby="t">
<title id="t">استطالة 100 متر عند ارتفاع 40 درجة مئوية</title>
<rect width="760" height="418" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">استطالة 100 متر عند ارتفاع 40 درجة مئوية</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">فولاذ</text>
<rect x="494.8" y="146" width="245.2" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
