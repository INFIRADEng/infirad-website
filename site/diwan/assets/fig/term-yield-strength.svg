<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" role="img" aria-labelledby="t">
<title id="t">مقاومة الخضوع: أين تنتهي المرونة</title>
<rect width="760" height="394" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">مقاومة الخضوع: أين تنتهي المرونة</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">σ_y تُقرأ عند انفعال 0.2% لمن لا خضوع واضح له</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">حدّ المرونة لحمل قضيب مساحة مقطعه 100 مم²</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">فولاذ إنشائي</text>
<rect x="304.8" y="146" width="435.2" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="294.8" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨250 MPa⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ألومنيوم · طرف أدنى</text>
<rect x="565.9" y="204" width="174.1" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="555.9" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨100 MPa⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ألومنيوم · طرف أعلى</text>
<rect x="270" y="262" width="470" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="260" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨270 MPa⁩</text>
<line x1="740" y1="308" x2="270" y2="308" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">135</text>
<text x="270" y="332" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">270</text>
<text x="380" y="368" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ما بعد الخضوع تشوّه دائم: التصميم يبقى تحته بمعامل أمان، لا عنده</text>
</g></svg>
