<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="t">
<title id="t">موازنة القانون الأول لنظام مغلق</title>
<rect width="760" height="310" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">موازنة القانون الأول لنظام مغلق</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ΔU = Q − W</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">100 جول دخلت النظام</text>
<rect x="505" y="170" width="190" height="72" rx="8" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-width="1.5"/>
<text x="600" y="200" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">حرارة داخلة Q</text>
<text x="600" y="226" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="middle" direction="ltr">⁨100 جول⁩</text>
<line x1="499" y1="206" x2="491" y2="206" stroke="#5d7079" stroke-width="2"/>
<path d="M479,206 l14,-7 l0,14 z" fill="#5d7079"/>
<rect x="285" y="170" width="190" height="72" rx="8" fill="#0e7490" fill-opacity="0.12" stroke="#0e7490" stroke-width="1.5"/>
<text x="380" y="200" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">شغل مبذول W</text>
<text x="380" y="226" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="middle" direction="ltr">⁨35 جول⁩</text>
<line x1="279" y1="206" x2="271" y2="206" stroke="#5d7079" stroke-width="2"/>
<path d="M259,206 l14,-7 l0,14 z" fill="#5d7079"/>
<rect x="65" y="170" width="190" height="72" rx="8" fill="#a16207" fill-opacity="0.12" stroke="#a16207" stroke-width="1.5"/>
<text x="160" y="200" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="middle">صافي ΔU</text>
<text x="160" y="226" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="middle" direction="ltr">⁨65 جول⁩</text>
<text x="380" y="284" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الشغل موجب إذا بذله النظام؛ عكس الإشارة يقلب النتيجة</text>
</g></svg>
