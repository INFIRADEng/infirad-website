<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-labelledby="t">
<title id="t">مول واحد من الماء بأربعة أوجه</title>
<rect width="760" height="434" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">مول واحد من الماء بأربعة أوجه</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الكتلة المولية جسر بين الوزن وعدد الجزيئات</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الحجم باللتر للبخار عند 273.15 كلفن و100 كيلوباسكال</text>
<rect x="80" y="140" width="600" height="50" fill="#1e3a5f" fill-opacity="0.14" stroke="#1e3a5f" stroke-opacity="0.45"/>
<text x="664" y="169" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">الكتلة المولية (غرام لكل مول)</text>
<text x="96" y="169" font-size="17" font-weight="600" fill="#1e3a5f" text-anchor="end">⁨18.02⁩</text>
<rect x="80" y="196" width="600" height="50" fill="#0e7490" fill-opacity="0.14" stroke="#0e7490" stroke-opacity="0.45"/>
<text x="664" y="225" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">عدد الجزيئات (عشرة أُسّ 21)</text>
<text x="96" y="225" font-size="17" font-weight="600" fill="#0e7490" text-anchor="end">⁨602.21⁩</text>
<rect x="80" y="252" width="600" height="50" fill="#a16207" fill-opacity="0.14" stroke="#a16207" stroke-opacity="0.45"/>
<text x="664" y="281" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">جزيئات في غرام واحد (عشرة أُسّ 21)</text>
<text x="96" y="281" font-size="17" font-weight="600" fill="#a16207" text-anchor="end">⁨33.43⁩</text>
<rect x="80" y="308" width="600" height="50" fill="#0a7a4a" fill-opacity="0.14" stroke="#0a7a4a" stroke-opacity="0.45"/>
<text x="664" y="337" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="start">حجم البخار (لتر)</text>
<text x="96" y="337" font-size="17" font-weight="600" fill="#0a7a4a" text-anchor="end">⁨22.71⁩</text>
<text x="380" y="408" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">عدد أفوغادرو صار ثابتًا مُعرَّفًا لا مقيسًا منذ 2019، فلا يحمل عدم يقين.</text>
</g></svg>
