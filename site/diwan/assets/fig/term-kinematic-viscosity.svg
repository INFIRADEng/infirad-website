<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" role="img" aria-labelledby="t">
<title id="t">اللزوجة الحركية: الماء أرقى من الهواء 15 ضعفًا</title>
<rect width="760" height="336" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">اللزوجة الحركية: الماء أرقى من الهواء 15 ضعفًا</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ν = μ/ρ بوحدة مم²/ث (1 مم²/ث = 1 cSt = 10⁻⁶ م²/ث)</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الماء محسوب من μ = 1.002×10⁻³ Pa·s وρ = 998.2 kg/m³ عند 20 °م</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">هواء · 20 °م</text>
<rect x="270" y="146" width="470" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="260" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨15 mm²/s⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">ماء · 20 °م</text>
<rect x="708.5" y="204" width="31.5" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="698.5" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨1 mm²/s⁩</text>
<line x1="740" y1="250" x2="270" y2="250" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">7.5</text>
<text x="270" y="274" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">15</text>
<text x="380" y="310" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">ν لا تعني أن الماء «ألزج» أكثر: الكثافة وحدها تفصل الفارق — μ للماء 55 ضعف الهواء</text>
</g></svg>
