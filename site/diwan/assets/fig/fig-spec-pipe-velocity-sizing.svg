<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img" aria-labelledby="t">
<title id="t">سرعة الماء عند 10 م³/ساعة حسب القطر الداخلي</title>
<rect width="760" height="534" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">سرعة الماء عند 10 م³/ساعة حسب القطر الداخلي</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">25 مم</text>
<rect x="270" y="146" width="470" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="262" y="158" font-size="17" font-weight="700" fill="#c2410c" text-anchor="end">5 m/s</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">32 مم</text>
<rect x="470.2" y="204" width="269.8" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="462.2" y="216" font-size="17" font-weight="700" fill="#0e7490" text-anchor="end">2.87 m/s</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">40 مم</text>
<rect x="541.7" y="262" width="198.3" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="533.7" y="274" font-size="17" font-weight="700" fill="#a16207" text-anchor="end">2.11 m/s</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">50 مم</text>
<rect x="619.7" y="320" width="120.3" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="611.7" y="332" font-size="17" font-weight="700" fill="#1e3a5f" text-anchor="end">1.28 m/s</text>
<text x="740" y="370" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">80 مم</text>
<rect x="685.5" y="378" width="54.5" height="14" fill="#0a7a4a" fill-opacity="0.85" rx="6"/>
<text x="677.5" y="390" font-size="17" font-weight="700" fill="#0a7a4a" text-anchor="end">0.58 m/s</text>
<line x1="740" y1="424" x2="270" y2="424" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">2.5</text>
<text x="270" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">5</text>
<text x="505" y="474" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">سرعة الماء (متر لكل ثانية)</text>
<text x="380" y="508" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">v = 4Q/(πd²) عند Q = 10 م³/ساعة، وأقطار داخلية جدولية.</text>
</g></svg>
