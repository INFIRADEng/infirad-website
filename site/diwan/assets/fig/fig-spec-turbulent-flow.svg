<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img" aria-labelledby="t">
<title id="t">عامل الاحتكاك في أنبوب أملس</title>
<rect width="760" height="534" fill="#ffffff"/>
<g font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" direction="rtl">
<text x="380" y="34" font-size="18" font-weight="700" fill="#1b2a2f" text-anchor="middle">عامل الاحتكاك في أنبوب أملس</text>
<text x="380" y="60" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">بلازيوس: f = 0.316 Re^−0.25</text>
<text x="380" y="84" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">الأس −0.25 يعني أن f يهبط ببطء شديد مع Re</text>
<text x="740" y="138" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">Re = 10,000</text>
<rect x="315.7" y="146" width="424.3" height="14" fill="#c2410c" fill-opacity="0.85" rx="6"/>
<text x="305.7" y="158" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨31.6 ×10⁻³⁩</text>
<text x="740" y="196" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">Re = 30,000</text>
<rect x="417.7" y="204" width="322.3" height="14" fill="#0e7490" fill-opacity="0.85" rx="6"/>
<text x="407.7" y="216" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨24 ×10⁻³⁩</text>
<text x="740" y="254" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">Re = 100,000</text>
<rect x="501" y="262" width="239" height="14" fill="#a16207" fill-opacity="0.85" rx="6"/>
<text x="491" y="274" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨17.8 ×10⁻³⁩</text>
<text x="740" y="312" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">Re = 300,000</text>
<rect x="558.7" y="320" width="181.3" height="14" fill="#1e3a5f" fill-opacity="0.85" rx="6"/>
<text x="548.7" y="332" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨13.5 ×10⁻³⁩</text>
<text x="740" y="370" font-size="17" font-weight="600" fill="#1b2a2f" text-anchor="start">Re = 1,000,000</text>
<rect x="605.7" y="378" width="134.3" height="14" fill="#0a7a4a" fill-opacity="0.85" rx="6"/>
<text x="595.7" y="390" font-size="17" font-weight="700" fill="#1b2a2f" text-anchor="end" direction="ltr">⁨10 ×10⁻³⁩</text>
<line x1="740" y1="424" x2="270" y2="424" stroke="#cbd5d9" stroke-width="1"/>
<text x="740" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="start">0</text>
<text x="505" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">17.5</text>
<text x="270" y="448" font-size="17" font-weight="400" fill="#5d7079" text-anchor="end">35</text>
<text x="505" y="474" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">عامل الاحتكاك f (×10⁻³)</text>
<text x="380" y="508" font-size="17" font-weight="400" fill="#5d7079" text-anchor="middle">صالح لأنبوب أملس · الخشونة ترفع f فوق هذه القيم عند Re العالية</text>
</g></svg>
