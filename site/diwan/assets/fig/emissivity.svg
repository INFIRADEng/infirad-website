<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title desc"><title id="title">الانبعاثية</title><desc id="desc">مقارنتان توضيحيتان عند درجة حرارة واحدة: سطح افتراضي بانبعاثية 0.8 يصدر أربعة أمثال سطح افتراضي بانبعاثية 0.2؛ لا تنسب القيم إلى مواد فعلية.</desc><style>text{font-family:Arial,"Noto Sans Arabic",sans-serif}</style><rect width="600" height="850" fill="white"/><text x="565" y="58" font-size="32" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">الانبعاثية</text><line x1="35" y1="86" x2="565" y2="86" stroke="#cbd5e1" stroke-width="2" stroke-dasharray=""/><text x="300" y="145" font-size="30" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">ε = E / Eblackbody</text><text x="565" y="205" font-size="28" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقارنة عند درجة الحرارة نفسها</text><text x="60" y="282" font-size="30" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">ε = 0.2</text><rect x="60" y="310" width="96.0" height="48" fill="#00A79D" fill-opacity="0.22" stroke="#001F3F" stroke-width="2"/><line x1="60" y1="375" x2="540" y2="375" stroke="#526276" stroke-width="2" stroke-dasharray=""/><text x="60" y="409" font-size="24" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">0</text><text x="540" y="409" font-size="24" fill="#001F3F" direction="ltr" text-anchor="end" unicode-bidi="plaintext">1</text><text x="60" y="442" font-size="30" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">ε = 0.8</text><rect x="60" y="470" width="384.0" height="48" fill="#00A79D" fill-opacity="0.22" stroke="#001F3F" stroke-width="2"/><line x1="60" y1="535" x2="540" y2="535" stroke="#526276" stroke-width="2" stroke-dasharray=""/><text x="60" y="569" font-size="24" fill="#001F3F" direction="ltr" text-anchor="start" unicode-bidi="plaintext">0</text><text x="540" y="569" font-size="24" fill="#001F3F" direction="ltr" text-anchor="end" unicode-bidi="plaintext">1</text><text x="565" y="620" font-size="27" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسبة القدرة الإشعاعية في المثال:</text><text x="300" y="664" font-size="30" fill="#001F3F" direction="ltr" text-anchor="middle" unicode-bidi="plaintext">0.8 ÷ 0.2 = 4</text><text x="565" y="715" font-size="24" fill="#001F3F" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قيم افتراضية للتوضيح، وليست قياس مادتين</text><line x1="35" y1="768" x2="565" y2="768" stroke="#cbd5e1" stroke-width="2" stroke-dasharray=""/><text x="35" y="802" font-size="20" fill="#526276" direction="ltr" text-anchor="start" unicode-bidi="plaintext">Lienhard, AHTT 6th ed., §10.1, eq. 10.4</text><text x="565" y="832" font-size="20" fill="#526276" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رسم تعليمي أصلي — انفراد</text></svg>